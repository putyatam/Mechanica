name: Windows Build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DUSE_STATIC_MSVC_RUNTIME_LIBRARY=OFF

      - name: Build Release
        run: cmake --build build --config Release --parallel
